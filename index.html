<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Drift</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0820;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><script>const SAVE_KEY="neon-drift-v1";
// Shared core: canvas fit, audio, save, particles, shake, optional CrazyGames SDK
const C=document.getElementById('c'),X=C.getContext('2d');let W=0,H=0,DPR=1;
function fit(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;C.width=W*DPR;C.height=H*DPR;C.style.width=W+'px';C.style.height=H+'px';X.setTransform(DPR,0,0,DPR,0,0);if(window.onFit)onFit();}
addEventListener('resize',fit);
const Save={k:SAVE_KEY,get(){try{return JSON.parse(localStorage.getItem(this.k))||{}}catch(e){return{}}},set(o){try{localStorage.setItem(this.k,JSON.stringify(o))}catch(e){}}};
let AC=null,muted=!!Save.get().muted;
function au(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d=.1,type='sine',v=.15,slide=0,delay=0){if(muted||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function noise(d=.15,v=.2){if(muted||!AC)return;const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=v;s.buffer=b;s.connect(g);g.connect(AC.destination);s.start();}
let parts=[],shakeT=0,shakeM=0,floats=[];
function burst(x,y,col,n=14,sp=4,life=40,sz=3){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life*(.5+Math.random()*.5),m:life,c:col,s:sz*(.5+Math.random())});}}
function floatText(x,y,t,c='#fff',s=22){floats.push({x,y,t,c,s,l:60});}
function shake(m,t=12){shakeM=Math.max(shakeM,m);shakeT=Math.max(shakeT,t);}
function stepFx(g=0){for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=g;p.vx*=.97;p.vy*=.97;p.l--;}parts=parts.filter(p=>p.l>0);for(const f of floats){f.y-=.8;f.l--;}floats=floats.filter(f=>f.l>0);if(shakeT>0)shakeT--;else shakeM=0;}
function drawFx(){for(const p of parts){X.globalAlpha=Math.max(0,p.l/p.m);X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.s,0,6.283);X.fill();}X.globalAlpha=1;X.textAlign='center';for(const f of floats){X.globalAlpha=Math.min(1,f.l/30);X.font=`900 ${f.s}px system-ui,sans-serif`;X.fillStyle=f.c;X.fillText(f.t,f.x,f.y);}X.globalAlpha=1;}
function shakeOff(){return shakeT>0?[(Math.random()-.5)*shakeM*2,(Math.random()-.5)*shakeM*2]:[0,0];}
const SDK={s(){try{return window.CrazyGames&&CrazyGames.SDK&&CrazyGames.SDK.environment!=='disabled'?CrazyGames.SDK:null}catch(e){return null}},start(){try{const s=this.s();s&&s.game.gameplayStart()}catch(e){}},stop(){try{const s=this.s();s&&s.game.gameplayStop()}catch(e){}},happy(){try{const s=this.s();s&&s.game.happytime()}catch(e){}}};
try{window.CrazyGames&&CrazyGames.SDK&&CrazyGames.SDK.init&&CrazyGames.SDK.init().catch(()=>{})}catch(e){}
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
function btn(x,y,w,h,label,col='#ffd23f',tc='#1a1030'){rr(x-w/2,y-h/2,w,h,h/2);X.fillStyle=col;X.fill();X.fillStyle=tc;X.font=`900 ${h*.42}px system-ui,sans-serif`;X.textAlign='center';X.textBaseline='middle';X.fillText(label,x,y+1);X.textBaseline='alphabetic';return {x:x-w/2,y:y-h/2,w,h};}
function inR(p,r){return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
function muteBtn(){const r={x:W-52,y:10,w:42,h:42};rr(r.x,r.y,r.w,r.h,12);X.fillStyle='rgba(255,255,255,.15)';X.fill();X.fillStyle='#fff';X.font='22px sans-serif';X.textAlign='center';X.fillText(muted?'🔇':'🔊',r.x+21,r.y+29);return r;}
function toggleMute(){muted=!muted;const s=Save.get();s.muted=muted;Save.set(s);}

// NEON DRIFT — endless neon dodger
const FW=400;let U=1,FX=0,VH=800;function onFit(){U=Math.min(W/FW,H/560);FX=(W-FW*U)/2;VH=H/U;}
const px=x=>FX+x*U,py=y=>y*U;
let save=Object.assign({best:0},Save.get());
let state='title',ship={x:200,tx:200,tilt:0},obs=[],dist=0,spd=5,score=0,gems=0,mult=1,nextAt=0,lastGap=200,tick=0,ui={},newBest=false,overT=0,keys={},trail=[],hue=190,flash=0,mouseMode=false,dragX=null;
const SR=12;
function shipY(){return VH*.8;}
function newGame(){obs=[];dist=0;spd=5;score=0;gems=0;mult=1;nextAt=VH*.6;lastGap=200;ship={x:200,tx:200,tilt:0};trail=[];newBest=false;state='play';SDK.start();}
function lvl(){return Math.min(1,dist/60000);}
function spawn(){const L=lvl(),sp=Math.max(190,330-L*150),r=Math.random(),maxShift=Math.min(170,sp/spd*9);
 const gapC=()=>{const g=Math.max(30,Math.min(370,lastGap+(Math.random()*2-1)*maxShift));lastGap=g;return g;};const y=-40;
 if(dist<1200||r<.42){const gw=Math.max(92,170-L*80),gx=Math.max(gw/2+8,Math.min(FW-gw/2-8,gapC()));obs.push({k:'bar',y,gx,gw,h:22,pass:false});if(Math.random()<.6)obs.push({k:'gem',x:gx,y:y-70});}
 else if(r<.62){const n=1+(Math.random()<.4+L*.4?1:0);for(let i=0;i<n;i++){const w=60+Math.random()*50;obs.push({k:'blk',x:30+Math.random()*(FW-60-w),y:y-i*110,w,h:34,vx:(Math.random()<.5?-1:1)*(1+L*2.5),pass:false});}for(let i=0;i<3;i++)obs.push({k:'gem',x:gapC(),y:y-60-i*40});nextAt=dist+sp+(n-1)*110+60;return;}
 else if(r<.8){const gx=gapC();for(let i=0;i<5;i++)obs.push({k:'gem',x:Math.max(20,Math.min(380,gx+Math.sin(i*.9)*60)),y:y-i*45});const side=gx>200?0:1;obs.push({k:'blk',x:side?FW-150:10,y:y-100,w:140,h:30,vx:0,pass:false});nextAt=dist+sp+120;return;}
 else{const gx=gapC(),gw=Math.max(100,180-L*70);obs.push({k:'spin',x:gx,y:y,len:gw*.5,a:Math.random()*6,va:(.03+L*.03)*(Math.random()<.5?-1:1),pass:false});obs.push({k:'gem',x:gx+(gx>200?-1:1)*(gw*.5+45),y:y-gw*.5-50});}
 nextAt=dist+sp;}
function rectHit(cx,cy,r,x,y,w,h){const nx=Math.max(x,Math.min(cx,x+w)),ny=Math.max(y,Math.min(cy,y+h));return(cx-nx)**2+(cy-ny)**2<r*r;}
function segHit(cx,cy,r,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,t=Math.max(0,Math.min(1,((cx-x1)*dx+(cy-y1)*dy)/(dx*dx+dy*dy)));return(cx-x1-dx*t)**2+(cy-y1-dy*t)**2<r*r;}
function crash(){state='over';overT=0;flash=12;const X0=px(ship.x),Y0=py(shipY());burst(X0,Y0,'#ff2e88',40,9,60,4);burst(X0,Y0,'#00f0ff',30,6,50,3);shake(16,26);noise(.5,.3);tone(140,.6,'sawtooth',.14,-90);SDK.stop();if(score>save.best){save.best=score;newBest=true;}Save.set(Object.assign(Save.get(),save));}
function update(){const L=lvl();spd=5+L*7;dist+=spd;hue=(190+dist/300)%360;if(dist>=nextAt)spawn();
 if(keys.l)ship.tx-=9;if(keys.r)ship.tx+=9;ship.tx=Math.max(SR,Math.min(FW-SR,ship.tx));const ox=ship.x;ship.x+=(ship.tx-ship.x)*.35;ship.tilt=Math.max(-.6,Math.min(.6,(ship.x-ox)*.06));
 const sy0=shipY();trail.push({x:ship.x,y:sy0+14});if(trail.length>18)trail.shift();for(const t of trail)t.y+=spd;
 for(const o of obs){o.y+=spd;if(o.k==='blk'){o.x+=o.vx;if(o.x<0||o.x+o.w>FW)o.vx*=-1;}if(o.k==='spin')o.a+=o.va;}
 const hr=SR-3;for(const o of obs){if(o.dead)continue;
  if(o.k==='gem'){if(Math.hypot(o.x-ship.x,o.y-sy0)<SR+12){o.dead=true;gems++;mult=Math.min(5,mult+.25);const v=Math.round(10*Math.floor(mult));score+=v;floatText(px(o.x),py(o.y)-10,'+'+v,'#ffe66d',18);burst(px(o.x),py(o.y),'#ffe66d',10,4,30,2.5);tone(880+Math.floor(mult)*110,.07,'sine',.11);}else if(o.y>sy0+40&&!o.miss){o.miss=true;mult=Math.max(1,mult-.5);}continue;}
  let hit=false;if(o.k==='bar')hit=rectHit(ship.x,sy0,hr,0,o.y,o.gx-o.gw/2,o.h)||rectHit(ship.x,sy0,hr,o.gx+o.gw/2,o.y,FW,o.h);else if(o.k==='blk')hit=rectHit(ship.x,sy0,hr,o.x,o.y,o.w,o.h);else if(o.k==='spin'){const c=Math.cos(o.a)*o.len,s=Math.sin(o.a)*o.len;hit=segHit(ship.x,sy0,hr+5,o.x-c,o.y-s,o.x+c,o.y+s);}
  if(hit){crash();return;}
  if(!o.pass&&o.y>sy0+20){o.pass=true;let near=false;if(o.k==='bar')near=Math.min(Math.abs(ship.x-(o.gx-o.gw/2)),Math.abs(ship.x-(o.gx+o.gw/2)))<SR+14;if(o.k==='blk')near=Math.min(Math.abs(ship.x-o.x),Math.abs(ship.x-o.x-o.w))<SR+12;if(near){score+=15;floatText(px(ship.x),py(sy0)-40,'CLOSE! +15','#00f0ff',20);tone(1200,.05,'square',.05);flash=3;}}}
 obs=obs.filter(o=>o.y<VH+80&&!o.dead);score+=spd/60;if(score>save.best&&save.best>0&&!newBest){newBest=true;floatText(W/2,H*.25,'NEW BEST!','#ff9ff3',34);SDK.happy();}
 if(tick%3===0)parts.push({x:px(ship.x+(Math.random()-.5)*8),y:py(sy0+16),vx:(Math.random()-.5),vy:2+Math.random()*2,l:22,m:22,c:`hsl(${hue},100%,60%)`,s:2.5});}
function neon(c,b){X.shadowColor=c;X.shadowBlur=b;}
function bg(){X.fillStyle='#07031a';X.fillRect(0,0,W,H);const hz=H*.0;X.strokeStyle=`hsla(${hue},100%,60%,.18)`;X.lineWidth=1;const gs=40*U,off=(dist*U)%gs;for(let y=off-gs;y<H;y+=gs){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke();}for(let x=FX%gs;x<W;x+=gs){X.beginPath();X.moveTo(x,0);X.lineTo(x,H);X.stroke();}
 X.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<40;i++){const y=((i*131)+dist*U*(.3+(i%4)*.25))%H;X.fillRect((i*97.3)%W,y,1.5,4+(i%4)*3);}
 const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(7,3,26,.9)');g.addColorStop(.3,'rgba(7,3,26,0)');X.fillStyle=g;X.fillRect(0,0,W,H);
 X.lineWidth=3;neon(`hsl(${hue},100%,60%)`,16);X.strokeStyle=`hsl(${hue},100%,65%)`;X.beginPath();X.moveTo(FX,0);X.lineTo(FX,H);X.moveTo(FX+FW*U,0);X.lineTo(FX+FW*U,H);X.stroke();X.shadowBlur=0;}
function drawObs(){const c2=`hsl(${(hue+150)%360},100%,60%)`;for(const o of obs){if(o.k==='gem'){const y=py(o.y),x=px(o.x),s=8*U*(1+.15*Math.sin(tick*.2+o.y));neon('#ffe66d',12);X.fillStyle='#ffe66d';X.beginPath();X.moveTo(x,y-s*1.3);X.lineTo(x+s,y);X.lineTo(x,y+s*1.3);X.lineTo(x-s,y);X.closePath();X.fill();continue;}
 neon(c2,18);X.fillStyle=c2;X.strokeStyle='#fff';X.lineWidth=2;
 if(o.k==='bar'){X.fillRect(px(0),py(o.y),(o.gx-o.gw/2)*U,o.h*U);X.fillRect(px(o.gx+o.gw/2),py(o.y),(FW-o.gx-o.gw/2)*U,o.h*U);X.shadowBlur=0;X.fillStyle='rgba(255,255,255,.6)';X.fillRect(px(0),py(o.y),(o.gx-o.gw/2)*U,3*U);X.fillRect(px(o.gx+o.gw/2),py(o.y),(FW-o.gx-o.gw/2)*U,3*U);}
 else if(o.k==='blk'){rr(px(o.x),py(o.y),o.w*U,o.h*U,8*U);X.fill();X.shadowBlur=0;X.stroke();}
 else{const c=Math.cos(o.a)*o.len,s=Math.sin(o.a)*o.len;X.strokeStyle=c2;X.lineWidth=12*U;X.lineCap='round';X.beginPath();X.moveTo(px(o.x-c),py(o.y-s));X.lineTo(px(o.x+c),py(o.y+s));X.stroke();X.shadowBlur=0;X.strokeStyle='#fff';X.lineWidth=4*U;X.stroke();X.fillStyle='#fff';X.beginPath();X.arc(px(o.x),py(o.y),7*U,0,6.283);X.fill();X.lineCap='butt';}
 X.shadowBlur=0;}}
function drawShip(){const x=px(ship.x),y=py(shipY()),s=SR*U*1.25;X.lineCap='round';for(let i=1;i<trail.length;i++){X.strokeStyle=`hsla(${hue},100%,60%,${i/trail.length*.6})`;X.lineWidth=(i/trail.length)*10*U;X.beginPath();X.moveTo(px(trail[i-1].x),py(trail[i-1].y));X.lineTo(px(trail[i].x),py(trail[i].y));X.stroke();}X.lineCap='butt';
 X.save();X.translate(x,y);X.rotate(ship.tilt);neon('#00f0ff',20);X.fillStyle='#0ff';X.beginPath();X.moveTo(0,-s*1.4);X.lineTo(s,s);X.lineTo(0,s*.55);X.lineTo(-s,s);X.closePath();X.fill();X.shadowBlur=0;X.fillStyle='#fff';X.beginPath();X.moveTo(0,-s*.8);X.lineTo(s*.35,s*.25);X.lineTo(-s*.35,s*.25);X.closePath();X.fill();X.restore();}
function txt(t,x,y,s,c='#fff',a='center'){X.font=`900 ${s}px system-ui,sans-serif`;X.textAlign=a;neon(c,s*.4);X.fillStyle=c;X.fillText(t,x,y);X.shadowBlur=0;}
function frame(){tick++;ui={};if(state==='play')update();else{dist+=3;hue=(190+dist/300)%360;}
 bg();const[ox,oy]=shakeOff();X.save();X.translate(ox,oy);drawObs();if(state!=='over')drawShip();stepFx(0);X.globalCompositeOperation='lighter';drawFx();X.globalCompositeOperation='source-over';X.restore();
 if(flash>0){X.fillStyle=`rgba(255,255,255,${flash/20})`;X.fillRect(0,0,W,H);flash--;}
 const m=Math.min(W,H*.7);
 if(state==='title'){txt('NEON',W/2,H*.22,m*.18,'#00f0ff');txt('DRIFT',W/2,H*.22+m*.16,m*.16,'#ff2e88');ui.play=btn(W/2,H*.66,Math.min(300,W*.7),64,'TAP TO PLAY','#00f0ff','#07031a');txt('BEST  '+Math.floor(save.best),W/2,H*.66+64,22);txt('Drag or Arrow keys to steer · grab gems · dodge everything',W/2,H*.93,Math.min(18,W*.04),'#ccf');}
 else{txt(Math.floor(score),W/2,Math.min(70,H*.09),Math.min(52,W*.12));if(mult>=2)txt('GEM x'+Math.floor(mult),W/2,Math.min(70,H*.09)+30,20,'#ffe66d');
  if(state==='play'&&dist<1500)txt('Drag or use Arrow keys to steer',W/2,H*.95,Math.min(22,W*.05),'#ccf');
  if(state==='over'){overT++;if(overT>40){X.fillStyle='rgba(5,0,20,.6)';X.fillRect(0,0,W,H);txt(newBest?'★ NEW BEST ★':'CRASHED',W/2,H*.3,m*.09,newBest?'#ffe66d':'#ff2e88');txt(Math.floor(score),W/2,H*.3+m*.18,m*.16);txt('Best '+Math.floor(save.best)+'  ·  Gems '+gems,W/2,H*.3+m*.26,m*.045,'#ccf');ui.play=btn(W/2,H*.72,Math.min(300,W*.7),64,'PLAY AGAIN','#00f0ff','#07031a');}}}
 ui.mute=muteBtn();requestAnimationFrame(frame);}
function start(){newGame();tone(440,.1,'triangle',.12,440);}
C.addEventListener('pointerdown',e=>{au();const p={x:e.clientX,y:e.clientY};if(inR(p,ui.mute)){toggleMute();return;}if(state==='title'){start();return;}if(state==='over'){if(overT>40&&inR(p,ui.play))start();return;}mouseMode=e.pointerType==='mouse';dragX=e.clientX;if(mouseMode)ship.tx=(e.clientX-FX)/U;});
C.addEventListener('pointermove',e=>{if(state!=='play')return;if(e.pointerType==='mouse'){ship.tx=Math.max(SR,Math.min(FW-SR,(e.clientX-FX)/U));}else if(dragX!=null){ship.tx=Math.max(SR,Math.min(FW-SR,ship.tx+(e.clientX-dragX)/U*1.4));dragX=e.clientX;}});
addEventListener('pointerup',()=>{dragX=null;});
addEventListener('keydown',e=>{if(['ArrowLeft','KeyA'].includes(e.code))keys.l=1;if(['ArrowRight','KeyD'].includes(e.code))keys.r=1;if(e.repeat)return;if(e.code==='KeyM')toggleMute();if(e.code==='Space'||e.code==='Enter'){e.preventDefault();au();if(state==='title')start();else if(state==='over'&&overT>40)start();}});
addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))keys.l=0;if(['ArrowRight','KeyD'].includes(e.code))keys.r=0;});
fit();frame();

</script></body></html>
